<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <!-- Premium Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="50%" style="stop-color:#d97706"/>
      <stop offset="100%" style="stop-color:#b45309"/>
    </linearGradient>
    
    <!-- Navy Gradient -->
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    
    <!-- Glow Effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Inner Shadow -->
    <filter id="innerShadow">
      <feOffset dx="0" dy="2"/>
      <feGaussianBlur stdDeviation="2" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="#000" flood-opacity="0.3" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>
  
  <!-- Background Shield -->
  <path d="M100 15 L170 40 L170 100 C170 140 140 175 100 190 C60 175 30 140 30 100 L30 40 Z" 
        fill="url(#navyGrad)" 
        stroke="url(#goldGrad)" 
        stroke-width="3"
        filter="url(#innerShadow)"/>
  
  <!-- Inner Shield Highlight -->
  <path d="M100 25 L160 47 L160 100 C160 135 133 166 100 179 C67 166 40 135 40 100 L40 47 Z" 
        fill="none" 
        stroke="rgba(251,191,36,0.3)" 
        stroke-width="1"/>
  
  <!-- 87 Text -->
  <text x="100" y="115" 
        font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-size="52" 
        font-weight="800" 
        fill="url(#goldGrad)" 
        text-anchor="middle"
        filter="url(#glow)">87</text>
  
  <!-- Accent Lines -->
  <line x1="60" y1="135" x2="140" y2="135" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="75" y1="145" x2="125" y2="145" stroke="rgba(251,191,36,0.5)" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Crown Detail at Top -->
  <path d="M85 22 L90 15 L100 20 L110 15 L115 22" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="2" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
